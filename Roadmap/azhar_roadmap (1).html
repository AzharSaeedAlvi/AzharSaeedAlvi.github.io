<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Azhar — 18-Month Engineering Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e2a;--surface:#1f2433;
  --border:rgba(255,255,255,0.07);--accent:#4f8ef7;--accent2:#7b5cf0;
  --text:#e8ecf4;--muted:#8892a4;--green:#34d399;--amber:#f59e0b;--red:#f87171;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;
}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh}
a{color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:2rem 1.5rem}

/* Header */
.header{margin-bottom:2rem}
.header h1{font-family:var(--font-head);font-size:1.8rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:.25rem}
.header p{color:var(--muted);font-size:.9rem}
.progress-bar-wrap{margin-top:1rem}
.progress-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:.4rem}
.progress-track{width:100%;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s ease}

/* Phase tabs */
.phase-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.5rem}
.phase-tab{padding:.4rem .9rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:.78rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.phase-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.phase-tab:hover:not(.active){background:var(--bg3);color:var(--text)}

/* Phase panel */
.phase-panel{display:none}
.phase-panel.active{display:block}
.phase-goal{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.25rem;font-size:.88rem;color:var(--muted)}
.phase-goal strong{color:var(--accent);display:block;margin-bottom:.25rem;font-size:.8rem;letter-spacing:.5px;text-transform:uppercase}
.phase-outcome{display:inline-flex;align-items:center;gap:.4rem;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);color:var(--green);padding:.25rem .75rem;border-radius:100px;font-size:.75rem;margin-top:.5rem}

/* Sections */
.section{margin-bottom:1rem;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.125rem;cursor:pointer;background:var(--bg2);transition:background .15s;gap:1rem}
.section-header:hover{background:var(--bg3)}
.section-title{font-size:.9rem;font-weight:500;color:var(--text)}
.section-meta{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.section-count{font-size:.75rem;color:var(--muted)}
.section-badge{font-size:.7rem;padding:.2rem .6rem;border-radius:100px;background:rgba(79,142,247,.12);color:var(--accent);white-space:nowrap}
.section-badge.done{background:rgba(52,211,153,.12);color:var(--green)}
.chevron{font-size:.75rem;color:var(--muted);transition:transform .2s}
.section.open .chevron{transform:rotate(180deg)}
.section-body{display:none;padding:.75rem 1.125rem;background:var(--bg);border-top:1px solid var(--border)}
.section.open .section-body{display:block}

/* Tasks */
.task{display:flex;align-items:flex-start;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:none}
.task input[type=checkbox]{margin-top:3px;width:15px;height:15px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
.task-text{font-size:.85rem;color:var(--text);line-height:1.5;transition:color .15s}
.task.done .task-text{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}
.task-tag{display:inline-block;font-size:.68rem;padding:.1rem .5rem;border-radius:4px;margin-right:.4rem;vertical-align:middle}
.tag-dsa{background:rgba(123,92,240,.15);color:#a78bfa}
.tag-project{background:rgba(52,211,153,.12);color:var(--green)}
.tag-aws{background:rgba(245,158,11,.12);color:var(--amber)}
.tag-career{background:rgba(79,142,247,.12);color:var(--accent)}
.tag-cs{background:rgba(248,113,113,.1);color:var(--red)}
.tag-sysdesign{background:rgba(236,72,153,.1);color:#f472b6}

/* Resource card */
.resource-card{margin-top:1rem;background:var(--bg3);border-radius:8px;padding:.875rem 1rem}
.resource-card h4{font-size:.75rem;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.resource-list{display:flex;flex-wrap:wrap;gap:.4rem}
.resource-pill{font-size:.75rem;background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:.25rem .7rem;border-radius:100px}

/* Reset button */
.reset-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--font-body);font-size:.75rem;padding:.35rem .8rem;border-radius:6px;cursor:pointer;transition:all .15s}
.reset-btn:hover{border-color:var(--red);color:var(--red)}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}

@media(max-width:600px){
  .phase-tab{font-size:.7rem;padding:.35rem .7rem}
  .task-text{font-size:.82rem}
}
</style>
</head>

</div>

let checked = {};

async function loadChecked() {
  try {
    const r = await window.storage.get(STORAGE_KEY);
    if (r) checked = JSON.parse(r.value);
  } catch(e) { checked = {}; }
}

async function saveChecked() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(checked)); } catch(e) {}
}

function taskId(phaseIdx, secIdx, taskIdx) {
  return `${phaseIdx}-${secIdx}-${taskIdx}`;
}

function updateProgress() {
  let total = 0, done = 0;
  phases.forEach((ph, pi) => ph.sections.forEach((sec, si) => sec.tasks.forEach((_, ti) => {
    total++;
    if (checked[taskId(pi,si,ti)]) done++;
  })));
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-label').textContent = `${done} of ${total} steps completed (${pct}%)`;
}

function sectionDoneCount(phaseIdx, secIdx) {
  const sec = phases[phaseIdx].sections[secIdx];
  return sec.tasks.filter((_,ti) => checked[taskId(phaseIdx,secIdx,ti)]).length;
}

function renderPhases() {
  const container = document.getElementById('phases');
  container.innerHTML = '';
  phases.forEach((ph, pi) => {
    const panel = document.createElement('div');
    panel.className = 'phase-panel' + (pi===0?' active':'');
    panel.id = 'phase-'+pi;

    let html = `<div class="phase-goal"><strong>Goal</strong>${ph.goal}<br><span class="phase-outcome">✓ ${ph.outcome}</span></div>`;

    ph.sections.forEach((sec, si) => {
      const doneCount = sectionDoneCount(pi, si);
      const total = sec.tasks.length;
      const allDone = doneCount === total;
      html += `<div class="section" id="sec-${pi}-${si}">
        <div class="section-header" onclick="toggleSection(${pi},${si})">
          <span class="section-title">${sec.title}</span>
          <span class="section-meta">
            <span class="section-count">${doneCount}/${total}</span>
            <span class="section-badge ${allDone?'done':''}">${allDone?'✓ Complete':'In progress'}</span>
            <span class="chevron">▾</span>
          </span>
        </div>
        <div class="section-body">`;

      sec.tasks.forEach((task, ti) => {
        const id = taskId(pi,si,ti);
        const isDone = !!checked[id];
        const tagMap = {dsa:'tag-dsa',project:'tag-project',aws:'tag-aws',career:'tag-career',cs:'tag-cs',sysdesign:'tag-sysdesign'};
        const tagLabel = {dsa:'DSA',project:'Project',aws:'AWS',career:'Career',cs:'Core CS',sysdesign:'Sys Design'};
        html += `<div class="task${isDone?' done':''}" id="task-${id}">
          <input type="checkbox" ${isDone?'checked':''} onchange="toggleTask(${pi},${si},${ti},this)" aria-label="${task.text}"/>
          <span class="task-text"><span class="task-tag ${tagMap[task.tag]||''}">${tagLabel[task.tag]||''}</span>${task.text}</span>
        </div>`;
      });

      if (sec.resources) {
        html += `<div class="resource-card"><h4>Resources</h4><div class="resource-list">`;
        sec.resources.forEach(r => { html += `<span class="resource-pill">${r}</span>`; });
        html += `</div></div>`;
      }

      html += `</div></div>`;
    });

    panel.innerHTML = html;
    container.appendChild(panel);
  });
  updateProgress();
}

function toggleSection(pi, si) {
  const el = document.getElementById(`sec-${pi}-${si}`);
  el.classList.toggle('open');
}

function toggleTask(pi, si, ti, checkbox) {
  const id = taskId(pi,si,ti);
  checked[id] = checkbox.checked;
  const taskEl = document.getElementById('task-'+id);
  taskEl.classList.toggle('done', checkbox.checked);
  saveChecked();

  const doneCount = sectionDoneCount(pi,si);
  const total = phases[pi].sections[si].tasks.length;
  const allDone = doneCount===total;
  const sec = document.getElementById(`sec-${pi}-${si}`);
  sec.querySelector('.section-count').textContent = `${doneCount}/${total}`;
  const badge = sec.querySelector('.section-badge');
  badge.textContent = allDone ? '✓ Complete' : 'In progress';
  badge.className = 'section-badge' + (allDone?' done':'');
  updateProgress();
      
  localStorage.setItem(task.id, checkbox.checked);

}

function showPhase(idx) {
  document.querySelectorAll('.phase-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('phase-'+idx).classList.add('active');
  document.querySelectorAll('.phase-tab')[idx].classList.add('active');
}

async function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  checked = {};
  try { await window.storage.set(STORAGE_KEY, '{}'); } catch(e) {}
  renderPhases();
}

loadChecked().then(renderPhases);


  // Restores the state when the page reloads...

  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".task").forEach(task => {
      const saved = localStorage.getItem(task.id);
        if (saved === "true") {
            task.classList.add("done");

            const checkbox =
                task.querySelector('input[type="checkbox"]');

            if (checkbox) {
                checkbox.checked = true;
            }
        }

    });

});
  
</script>
